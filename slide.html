<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sliding Image Puzzle – Vanilla JS (Solvable, Timer, 3×3 / 4×4)</title>
  <style>
    :root{
      --board-size: 480px; /* tweak this to change puzzle size */
      --gap: 6px;
      --radius: 14px;
      --accent: #3b82f6;
      --bg: #0b1020;
      --panel: #121a32;
      --text: #e6e9f2;
      --muted: #9aa3b2;
      --success: #10b981;
      --danger: #ef4444;
    }
    *{box-sizing: border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(1200px 600px at 10% -10%, #1b2552 0%, transparent 60%),
                  radial-gradient(900px 400px at 120% 10%, #3b1d5a 0%, transparent 60%),
                  var(--bg);
      display: grid; place-items: center; padding: 24px;
    }
    .app{width:min(100%, 1100px); display:grid; grid-template-columns: 1fr auto; gap:20px;}
    @media (max-width: 980px){ .app{grid-template-columns: 1fr;} }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 18px; backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .toolbar{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
    .toolbar h1{ grid-column: 1 / -1; font-size: clamp(20px, 2.2vw, 28px); margin: 2px 0 10px; letter-spacing: .3px; }

    .field{ display:flex; flex-direction: column; gap: 6px; }
    label{ font-size: 13px; color: var(--muted); }
    select, input[type="text"], input[type="file"]{
      background: #0e1530; color: var(--text); border:1px solid #243055; border-radius: 12px; padding: 10px 12px; width: 100%;
    }

    .btns{ display:flex; flex-wrap: wrap; gap:10px; grid-column: 1 / -1; }
    button{
      appearance: none; border:1px solid transparent; background: #1d2a55; color: var(--text);
      padding: 10px 14px; border-radius: 14px; cursor: pointer; font-weight: 600;
      transition: transform .05s ease, filter .2s ease, background .2s ease;
    }
    button:hover{ filter: brightness(1.05); }
    button:active{ transform: translateY(1px); }
    .primary{ background: var(--accent); color: white; }
    .danger{ background: #2a1b1b; border-color: #5a2b2b; }
    .success{ background: var(--success); color: #05120e; }
    .ghost{ background: transparent; border-color: #2a355f; }

    .stats{ display:flex; gap:16px; align-items:center; font-variant-numeric: tabular-nums; margin-top: 6px; }
    .pill{ background: #0f1733; border:1px solid #23305a; padding: 8px 12px; border-radius: 999px; }

    .board-wrap{ display:grid; place-items:center; }
    .board{
      position: relative; width: var(--board-size); height: var(--board-size);
      display:grid; gap: var(--gap); background: #0c1227; padding: var(--gap);
      border-radius: var(--radius); border:1px solid #273256; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      user-select: none;
    }
    .tile{
      position: relative; display:grid; place-items:center; font-weight:800; font-size: clamp(16px, 2.4vw, 28px);
      border-radius: 12px; cursor: pointer; overflow:hidden; isolation:isolate;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      box-shadow: 0 8px 18px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.06);
      transition: transform .12s ease;
    }
    .tile:active{ transform: scale(.99); }
    .tile::after{ content: attr(data-idx); position:absolute; inset:auto 8px 8px auto; font-size:12px; font-weight:700; color:rgba(255,255,255,.9);
      background: rgba(0,0,0,.35); padding: 3px 6px; border-radius: 999px; border:1px solid rgba(255,255,255,.18); }

    .tile.solved{ outline: 2px solid rgba(16,185,129,.7); outline-offset:-2px; }

    .message{ margin-top: 12px; font-weight: 700; }

    .preview{ width: 200px; height: 200px; border-radius: 14px; overflow:hidden; border:1px solid #2a355f; background:#0e1530; display:grid; place-items:center; }
    .preview img{ width:100%; height:100%; object-fit: cover; }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel">
      <div class="toolbar">
        <h1>Sliding Image Puzzle — Vanilla JS</h1>

        <div class="field">
          <label for="grid">Grid Size</label>
          <select id="grid">
            <option value="3">3 × 3</option>
            <option value="4" selected>4 × 4</option>
          </select>
        </div>

        <div class="field">
          <label for="imgUrl">Image URL (optional)</label>
          <input id="imgUrl" type="text" placeholder="Paste an image URL or leave blank" />
        </div>

        <div class="field">
          <label for="imgFile">Or upload an image</label>
          <input id="imgFile" type="file" accept="image/*" />
        </div>

        <div class="btns">
          <button id="shuffleBtn" class="primary">🔀 Shuffle & Start</button>
          <button id="pauseBtn" class="ghost">⏸️ Pause</button>
          <button id="resetBtn" class="danger">↺ Reset</button>
          <button id="solveBtn" class="ghost">✅ Show Solved</button>
        </div>

        <div class="stats">
          <div class="pill">⏱️ <span id="time">00:00</span></div>
          <div class="pill">🧮 Moves: <span id="moves">0</span></div>
          <div class="pill">📐 Size: <span id="sizeLabel">4 × 4</span></div>
        </div>

        <div class="message" id="message"></div>
      </div>
    </section>

    <section class="panel board-wrap">
      <div id="board" class="board" aria-label="Sliding Puzzle Board"></div>
      <div style="margin-top:14px; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px;">
        <span>Tip: Click a tile next to the empty space to slide. Shuffle performs random valid moves to ensure solvability.</span>
      </div>
      <div style="margin-top:16px; display:flex; gap:12px; align-items:center;">
        <div class="preview"><img id="previewImg" alt="Preview" /></div>
        <div style="max-width:420px; color:var(--muted); font-size:13px; line-height:1.5;">
          Use an image URL or upload your own. If neither is provided, a default scenic image is used.
        </div>
      </div>
    </section>
  </div>

  <script>
    // ---------------- Utility helpers ----------------
    const $ = (sel, root=document) => root.querySelector(sel);
    const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

    function formatTime(sec){
      const m = Math.floor(sec/60).toString().padStart(2,'0');
      const s = Math.floor(sec%60).toString().padStart(2,'0');
      return `${m}:${s}`;
    }

    // ---------------- Puzzle state ----------------
    const boardEl = $('#board');
    const gridSel = $('#grid');
    const imgUrlInput = $('#imgUrl');
    const imgFileInput = $('#imgFile');
    const timeEl = $('#time');
    const movesEl = $('#moves');
    const sizeLabel = $('#sizeLabel');
    const msgEl = $('#message');
    const previewImg = $('#previewImg');

    const shuffleBtn = $('#shuffleBtn');
    const pauseBtn = $('#pauseBtn');
    const resetBtn = $('#resetBtn');
    const solveBtn = $('#solveBtn');

    const DEFAULT_IMG = 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1200&auto=format&fit=crop';

    let N = parseInt(gridSel.value, 10); // tiles per side
    let size = N*N; // total tiles
    let state = []; // state[pos] = tileIndex (0..size-1), last is blank (size-1)
    let blankPos = size-1;
    let running = false, paused = false, solved = true;
    let moves = 0; let seconds = 0; let timerId = null;
    let imgSrc = DEFAULT_IMG; let imgLoaded = false; let img = new Image();

    function setBoardGrid(){
      boardEl.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
      sizeLabel.textContent = `${N} × ${N}`;
    }

    function initState(){
      size = N*N; state = Array.from({length:size}, (_,i)=>i); blankPos = size-1; solved = true; moves = 0; seconds = 0;
      timeEl.textContent = '00:00'; movesEl.textContent = '0'; msgEl.textContent = '';
    }

    function render(){
      boardEl.innerHTML = '';
      setBoardGrid();
      const tileSizePct = 100 * N; // background-size in %
      for(let pos=0; pos<size; pos++){
        const tile = state[pos];
        const r = Math.floor(tile / N); const c = tile % N;
        if(tile === size-1){
          // blank
          const blank = document.createElement('div');
          blank.className = 'tile blank';
          blank.style.visibility = 'hidden';
          boardEl.appendChild(blank);
          continue;
        }
        const el = document.createElement('button');
        el.className = 'tile';
        el.type = 'button';
        el.dataset.idx = tile+1; // show human-friendly index
        // Slice background using background-position
        el.style.backgroundImage = `url("${imgSrc}")`;
        el.style.backgroundSize = `${tileSizePct}% ${tileSizePct}%`;
        el.style.backgroundPosition = `${(c/(N-1))*100}% ${(r/(N-1))*100}%`;
        el.addEventListener('click', () => tryMove(pos));
        boardEl.appendChild(el);
      }
      // highlight correct tiles
      $$('.tile', boardEl).forEach((el, i) => {
        const tileIdx = state[i];
        el.classList.toggle('solved', tileIdx === i);
      });
    }

    function neighbors(pos){
      const nb = [];
      const r = Math.floor(pos / N), c = pos % N;
      if(r>0) nb.push(pos - N);
      if(r<N-1) nb.push(pos + N);
      if(c>0) nb.push(pos - 1);
      if(c<N-1) nb.push(pos + 1);
      return nb;
    }

    function tryMove(pos, skipRecord=false){
      if(!running || paused) return;
      if(neighbors(pos).includes(blankPos)){
        // swap
        [state[pos], state[blankPos]] = [state[blankPos], state[pos]];
        blankPos = pos;
        if(!skipRecord){ moves++; movesEl.textContent = String(moves); }
        render();
        checkSolved();
      }
    }

    function checkSolved(){
      const ok = state.every((v, i) => v === i);
      if(ok){
        running = false; solved = true; clearInterval(timerId); timerId = null;
        msgEl.textContent = `🎉 Solved in ${formatTime(seconds)} with ${moves} moves!`;
        msgEl.style.color = 'var(--success)';
      }
    }

    function startTimer(){
      clearInterval(timerId); timerId = setInterval(()=>{ if(!paused) { seconds++; timeEl.textContent = formatTime(seconds); } }, 1000);
    }

    function pauseGame(){ paused = true; pauseBtn.textContent = '▶️ Resume'; pauseBtn.classList.add('success'); }
    function resumeGame(){ paused = false; pauseBtn.textContent = '⏸️ Pause'; pauseBtn.classList.remove('success'); }

    function shuffleMoves(steps=300){
      // Perform valid random moves from solved state — guarantees solvable configuration.
      let lastPos = -1;
      for(let i=0;i<steps;i++){
        const nb = neighbors(blankPos).filter(p => p !== lastPos); // avoid immediate undo
        const pick = nb[Math.floor(Math.random()*nb.length)];
        // move tile at pick into blank
        [state[pick], state[blankPos]] = [state[blankPos], state[pick]];
        lastPos = blankPos; blankPos = pick;
      }
    }

    function shuffleAndStart(){
      initState();
      shuffleMoves(400 + N*100);
      running = true; paused = false; solved = false; seconds = 0; moves = 0;
      timeEl.textContent = '00:00'; movesEl.textContent = '0'; msgEl.textContent = '';
      startTimer();
      render();
    }

    function reset(){ initState(); running = false; paused = false; clearInterval(timerId); timerId=null; render(); }

    function showSolved(){ initState(); render(); }

    // ---------------- Image handling ----------------
    function setImage(src){
      imgSrc = src || DEFAULT_IMG;
      previewImg.src = imgSrc;
      imgLoaded = false;
      img = new Image();
      img.onload = () => { imgLoaded = true; render(); };
      img.onerror = () => { imgSrc = DEFAULT_IMG; previewImg.src = imgSrc; imgLoaded = true; render(); };
      img.src = imgSrc;
    }

    imgUrlInput.addEventListener('change', () => setImage(imgUrlInput.value.trim()));
    imgFileInput.addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if(!f) return;
      const url = URL.createObjectURL(f);
      setImage(url);
    });

    // ---------------- Controls ----------------
    gridSel.addEventListener('change', () => {
      N = parseInt(gridSel.value,10);
      setBoardGrid();
      reset();
    });
    shuffleBtn.addEventListener('click', shuffleAndStart);
    pauseBtn.addEventListener('click', () => { if(!running) return; paused ? resumeGame() : pauseGame(); });
    resetBtn.addEventListener('click', reset);
    solveBtn.addEventListener('click', showSolved);

    // Optional: arrow-key controls to slide blank by attempting to move opposite tile
    document.addEventListener('keydown', (e) => {
      if(!running || paused) return;
      const r = Math.floor(blankPos / N), c = blankPos % N;
      let target = null;
      if(e.key === 'ArrowUp' && r < N-1) target = blankPos + N; // move tile down into blank
      if(e.key === 'ArrowDown' && r > 0) target = blankPos - N;
      if(e.key === 'ArrowLeft' && c < N-1) target = blankPos + 1;
      if(e.key === 'ArrowRight' && c > 0) target = blankPos - 1;
      if(target !== null){ tryMove(target); }
    });

    // ---------------- Init ----------------
    setImage(DEFAULT_IMG);
    N = parseInt(gridSel.value,10); setBoardGrid(); initState(); render();
  </script>
</body>
</html>
